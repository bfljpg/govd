services:
  bot:
    build: .
    container_name: govdbot
    restart: unless-stopped
    networks:
      - govd-network
    env_file:
      - .env
    volumes:
      - ./private:/app/private
      - ./logs:/app/logs
      - ./downloads:/app/downloads
    ports:
      - "${METRICS_PORT-}:8080"
      - "${PROFILER_PORT-}:6060"
    depends_on:
      db:
        condition: service_healthy
      telegram-bot-api:
        condition: service_started

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: govd_telegram_api
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: "${TELEGRAM_API_ID}"
      TELEGRAM_API_HASH: "${TELEGRAM_API_HASH}"
      TELEGRAM_LOCAL: "1"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    networks:
      - govd-network

  db:
    image: postgres:latest
    container_name: govd_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: govd
      POSTGRES_USER: govd
      POSTGRES_PASSWORD: password
    volumes:
      - db:/var/lib/postgresql
    networks:
      - govd-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U govd" ]
      interval: 3s
      timeout: 5s
      retries: 30

volumes:
  db:
  telegram-bot-api-data:


networks:
  govd-network:
    driver: bridge
